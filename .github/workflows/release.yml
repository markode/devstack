# Build DevStack installers on tag push (v*) and upload to a draft GitHub Release.
# Unsigned builds work out of the box. Optional signing/notarization via secrets (see docs/packaging.md).

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0) — optional for manual runs"
        required: false

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust_target: x86_64-apple-darwin
          - platform: windows-latest
            args: ""
            rust_target: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend deps
        run: npm ci

      # Empty APPLE_* / TAURI_* secrets expand to "" in Actions; Tauri still sees the
      # env var as set and tries PKCS#12 import → codesign failure. Only forward
      # non-empty values so unsigned CI builds succeed.
      - name: Export optional signing env
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export_if_set() {
            local name="$1"
            local value="$2"
            if [ -n "$value" ]; then
              {
                echo "${name}<<EOF"
                printf '%s\n' "$value"
                echo "EOF"
              } >> "$GITHUB_ENV"
              echo "Forwarding ${name}"
            else
              echo "Skipping empty ${name} (unsigned build)"
            fi
          }
          export_if_set APPLE_CERTIFICATE "${APPLE_CERTIFICATE:-}"
          export_if_set APPLE_CERTIFICATE_PASSWORD "${APPLE_CERTIFICATE_PASSWORD:-}"
          export_if_set APPLE_SIGNING_IDENTITY "${APPLE_SIGNING_IDENTITY:-}"
          export_if_set APPLE_ID "${APPLE_ID:-}"
          export_if_set APPLE_PASSWORD "${APPLE_PASSWORD:-}"
          export_if_set APPLE_TEAM_ID "${APPLE_TEAM_ID:-}"
          export_if_set TAURI_SIGNING_PRIVATE_KEY "${TAURI_SIGNING_PRIVATE_KEY:-}"
          export_if_set TAURI_SIGNING_PRIVATE_KEY_PASSWORD "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}"

      - name: Build Tauri installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "DevStack ${{ github.ref_name }}"
          releaseBody: |
            DevStack desktop installers.

            - macOS: `.dmg` (arm64 / x64)
            - Windows: NSIS `.exe` / `.msi`

            Unsigned CI builds are expected when signing secrets are unset.
            See `docs/packaging.md` for code signing and notarization.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
