# Build DevStack installers on tag push (v*) and upload to a prerelease GitHub Release.
# Unsigned builds work out of the box. Optional signing/notarization via secrets (see docs/packaging.md).

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0) — optional for manual runs"
        required: false

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          # Separate macOS targets so release assets include both arm64 and x64
          # .dmg files (four installers with Windows .exe + .msi).
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust_target: x86_64-apple-darwin
          - platform: windows-latest
            args: ""
            rust_target: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend deps
        run: npm ci

      # Empty APPLE_* / TAURI_* secrets expand to "" in Actions; Tauri still sees the
      # env var as set and tries PKCS#12 import → codesign failure. Only forward
      # non-empty values so unsigned CI builds succeed.
      # Force bash so this works on windows-latest (default shell is pwsh).
      - name: Export optional signing env
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export_if_set() {
            local name="$1"
            local value="$2"
            if [ -n "$value" ]; then
              {
                echo "${name}<<EOF"
                printf '%s\n' "$value"
                echo "EOF"
              } >> "$GITHUB_ENV"
              echo "Forwarding ${name}"
            else
              echo "Skipping empty ${name} (unsigned build)"
            fi
          }
          export_if_set APPLE_CERTIFICATE "${APPLE_CERTIFICATE:-}"
          export_if_set APPLE_CERTIFICATE_PASSWORD "${APPLE_CERTIFICATE_PASSWORD:-}"
          export_if_set APPLE_SIGNING_IDENTITY "${APPLE_SIGNING_IDENTITY:-}"
          export_if_set APPLE_ID "${APPLE_ID:-}"
          export_if_set APPLE_PASSWORD "${APPLE_PASSWORD:-}"
          export_if_set APPLE_TEAM_ID "${APPLE_TEAM_ID:-}"
          export_if_set TAURI_SIGNING_PRIVATE_KEY "${TAURI_SIGNING_PRIVATE_KEY:-}"
          export_if_set TAURI_SIGNING_PRIVATE_KEY_PASSWORD "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}"

      - name: Build Tauri installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "DevStack ${{ github.ref_name }}"
          releaseBody: |
            DevStack desktop installers.

            - macOS: arm64 `.dmg` and Intel x64 `.dmg`
            - Windows: NSIS `.exe` / `.msi`

            Unsigned CI builds are expected when signing secrets are unset.
            See `docs/packaging.md` for code signing and notarization.
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }}

  # Dedicated E2E on the tagged commit after installers build — verifies clean + busy-port flows.
  release-e2e:
    needs: publish
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Frontend typecheck + vitest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci
          npm run smoke:frontend
          npm test

      - name: Playwright responsive header screenshots
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npx playwright install chromium
          npm run test:e2e

      - name: Release E2E — clean ports + busy 80/443/3306/8025 + Windows feature matrix
        working-directory: src-tauri
        shell: pwsh
        env:
          DEVSTACK_DATA_DIR: ${{ runner.temp }}\devstack-release-e2e
          DEVSTACK_RESET_SITES: "1"
          DEVSTACK_MATRIX_JSON: ${{ runner.temp }}\windows-matrix.json
          DEVSTACK_MATRIX_MD: ${{ github.workspace }}\docs\test-report-v0.3.1.md
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --bin devstack_smoke --release
          $bin = Join-Path (Get-Location) 'target\release\devstack_smoke.exe'
          & $bin --e2e
          if ($LASTEXITCODE -ne 0) { throw "release E2E failed ($LASTEXITCODE)" }
          if (-not (Test-Path $env:DEVSTACK_MATRIX_MD)) {
            throw "Windows feature matrix report missing"
          }
          Write-Host "Release E2E verified: dual nginx+apache HTML 200, WAMP coexist (80/443/3306/8025), status error, stopped status + feature matrix"

      - name: Upload Windows feature matrix report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-feature-matrix-release-v0.3.1
          path: |
            ${{ runner.temp }}/windows-matrix.json
            docs/test-report-v0.3.1.md
          if-no-files-found: warn
