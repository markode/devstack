# Best-effort Windows HTTPS / hosts / process-flags verification for PRs and tags.
name: Windows HTTPS smoke

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo test (incl. CREATE_NO_WINDOW / hosts helpers)
        working-directory: src-tauri
        run: cargo test --lib -- --nocapture

      - name: Process flag + hosts merge unit checks
        working-directory: src-tauri
        shell: pwsh
        run: |
          cargo test --lib services::process::tests -- --nocapture
          cargo test --lib services::dns::tests -- --nocapture
          cargo test --lib packages::version_cache::tests -- --nocapture

      - name: Synthetic HTTPS probe (hosts + openssl s_server + curl)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $site = 'devstack-ci.test'
          $port = 18443
          $tmp = Join-Path $env:TEMP "devstack-https-smoke"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          $cert = Join-Path $tmp 'cert.pem'
          $key = Join-Path $tmp 'key.pem'
          $outLog = Join-Path $tmp 's_server.out'

          $openssl = Get-Command openssl -ErrorAction SilentlyContinue
          if (-not $openssl) {
            Write-Host 'openssl not on PATH — skipping live HTTPS probe'
            exit 0
          }

          & openssl req -x509 -newkey rsa:2048 -sha256 -days 1 -nodes `
            -keyout $key -out $cert -subj "/CN=$site"
          if (-not (Test-Path $cert)) { throw 'openssl failed to write cert' }

          $hostsFile = "$env:SystemRoot\System32\drivers\etc\hosts"
          $entry = "127.0.0.1 $site"
          try {
            Add-Content -LiteralPath $hostsFile -Value "`n$entry" -ErrorAction Stop
            ipconfig /flushdns | Out-Null
            Write-Host "Wrote hosts entry for $site"
            Resolve-DnsName $site -ErrorAction SilentlyContinue | Format-Table | Out-String | Write-Host
          } catch {
            Write-Host "Hosts write skipped (no admin): $($_.Exception.Message)"
            $site = '127.0.0.1'
          }

          # openssl s_server is more reliable than the Windows Python stub on runners.
          $proc = Start-Process -FilePath $openssl.Source `
            -ArgumentList @('s_server','-accept',"$port",'-cert',$cert,'-key',$key,'-www','-naccept','1') `
            -PassThru -WindowStyle Hidden `
            -RedirectStandardOutput $outLog -RedirectStandardError $outLog
          Start-Sleep -Seconds 2
          if ($proc.HasExited) {
            Get-Content $outLog -ErrorAction SilentlyContinue | Write-Host
            throw "openssl s_server exited early (code $($proc.ExitCode))"
          }
          try {
            $url = "https://${site}:${port}/"
            $curl = Get-Command curl.exe -ErrorAction Stop
            & $curl.Source -k -fsS --max-time 15 -o (Join-Path $tmp 'body.txt') -w '%{http_code}' $url |
              Tee-Object -Variable code | Out-Null
            if ($code -ne '200') {
              Get-Content $outLog -ErrorAction SilentlyContinue | Write-Host
              throw "Expected HTTP 200 from $url, got '$code'"
            }
            Write-Host "HTTPS probe OK: $url -> $code"
            # Also exercise Resolve-DnsName + Invoke-WebRequest path used in the product docs.
            if ($site -ne '127.0.0.1') {
              Resolve-DnsName $site | Out-Null
            }
            $resp = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 15 -SkipCertificateCheck
            if ($resp.StatusCode -ne 200) { throw "Invoke-WebRequest expected 200, got $($resp.StatusCode)" }
            Write-Host "Invoke-WebRequest OK: $($resp.StatusCode)"
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }
