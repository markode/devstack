# Windows unit tests + end-to-end stack smoke (PHP + MariaDB + Nginx + sites).
name: Windows HTTPS smoke

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo test (incl. CREATE_NO_WINDOW / hosts / php.ini / paths)
        working-directory: src-tauri
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          # Windows runners occasionally fail the test binary with STATUS_ENTRYPOINT_NOT_FOUND (0xC0000139) —
          # a loader flake, not an assertion. Retry once after a clean rebuild.
          cargo test --lib -- --nocapture
          if ($LASTEXITCODE -ne 0) {
            Write-Host "cargo test failed ($LASTEXITCODE) — clean retry"
            cargo clean -p devstack
            cargo test --lib -- --nocapture
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Process flag + hosts + php.ini unit checks
        working-directory: src-tauri
        shell: pwsh
        run: |
          cargo test --lib services::process::tests -- --nocapture
          cargo test --lib services::dns::tests -- --nocapture
          cargo test --lib packages::version_cache::tests -- --nocapture
          cargo test --lib php::tests -- --nocapture
          cargo test --lib paths_util::tests -- --nocapture
          cargo test --lib services::tls::tests -- --nocapture
          cargo test --lib services::pma_signon::tests -- --nocapture
          cargo test --lib services::httpd::tests -- --nocapture

      - name: Frontend typecheck + vitest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci
          npm run smoke:frontend
          npm test

      - name: Playwright responsive header screenshots
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npx playwright install chromium
          npm run test:e2e

      - name: E2E — install PHP + MariaDB + Nginx, sites, curl, DB round-trip
        working-directory: src-tauri
        shell: pwsh
        env:
          DEVSTACK_DATA_DIR: ${{ runner.temp }}\devstack-e2e
          DEVSTACK_RESET_SITES: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --bin devstack_smoke --release
          $bin = Join-Path (Get-Location) 'target\release\devstack_smoke.exe'
          & $bin --e2e
          if ($LASTEXITCODE -ne 0) { throw "devstack_smoke --e2e failed ($LASTEXITCODE)" }

      - name: Synthetic HTTPS probe (hosts + openssl s_server + curl)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $site = 'devstack-ci.test'
          $port = 18443
          $tmp = Join-Path $env:TEMP "devstack-https-smoke"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          $cert = Join-Path $tmp 'cert.pem'
          $key = Join-Path $tmp 'key.pem'
          $outLog = Join-Path $tmp 's_server.out'
          $errLog = Join-Path $tmp 's_server.err'

          $openssl = Get-Command openssl -ErrorAction SilentlyContinue
          if (-not $openssl) {
            Write-Host 'openssl not on PATH — skipping live HTTPS probe'
            exit 0
          }

          & openssl req -x509 -newkey rsa:2048 -sha256 -days 1 -nodes `
            -keyout $key -out $cert -subj "/CN=$site"
          if (-not (Test-Path $cert)) { throw 'openssl failed to write cert' }

          $hostsFile = "$env:SystemRoot\System32\drivers\etc\hosts"
          $entry = "127.0.0.1 $site"
          try {
            Add-Content -LiteralPath $hostsFile -Value "`n$entry" -ErrorAction Stop
            ipconfig /flushdns | Out-Null
            Write-Host "Wrote hosts entry for $site"
          } catch {
            Write-Host "Hosts write skipped (no admin): $($_.Exception.Message)"
            $site = '127.0.0.1'
          }

          $proc = Start-Process -FilePath $openssl.Source `
            -ArgumentList @('s_server','-accept',"$port",'-cert',$cert,'-key',$key,'-www') `
            -PassThru -WindowStyle Hidden `
            -RedirectStandardOutput $outLog -RedirectStandardError $errLog
          Start-Sleep -Seconds 2
          if ($proc.HasExited) {
            Get-Content $outLog,$errLog -ErrorAction SilentlyContinue | Write-Host
            throw "openssl s_server exited early (code $($proc.ExitCode))"
          }
          try {
            $url = "https://${site}:${port}/"
            $curl = Get-Command curl.exe -ErrorAction Stop
            $code = & $curl.Source -k -sS --max-time 15 -o (Join-Path $tmp 'body.txt') -w '%{http_code}' $url
            if ($LASTEXITCODE -ne 0 -or $code -ne '200') {
              Get-Content $outLog,$errLog -ErrorAction SilentlyContinue | Write-Host
              throw "Expected HTTP 200 from $url, got '$code' (curl exit $LASTEXITCODE)"
            }
            Write-Host "HTTPS probe OK: $url -> $code"
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }
