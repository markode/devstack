# Windows unit tests + end-to-end stack smoke (PHP + MariaDB + Nginx + sites).
name: Windows HTTPS smoke

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo test (incl. CREATE_NO_WINDOW / hosts / php.ini / paths)
        working-directory: src-tauri
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          # Windows runners occasionally fail the test binary with STATUS_ENTRYPOINT_NOT_FOUND (0xC0000139) —
          # a loader flake, not an assertion. Retry once after a clean rebuild.
          cargo test --lib -- --nocapture
          if ($LASTEXITCODE -ne 0) {
            Write-Host "cargo test failed ($LASTEXITCODE) — clean retry"
            cargo clean -p devstack
            cargo test --lib -- --nocapture
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Process flag + hosts + php.ini unit checks
        working-directory: src-tauri
        shell: pwsh
        run: |
          cargo test --lib services::process::tests -- --nocapture
          cargo test --lib services::dns::tests -- --nocapture
          cargo test --lib packages::version_cache::tests -- --nocapture
          cargo test --lib php::tests -- --nocapture
          cargo test --lib paths_util::tests -- --nocapture
          cargo test --lib services::tls::tests -- --nocapture
          cargo test --lib services::pma_signon::tests -- --nocapture
          cargo test --lib services::httpd::tests -- --nocapture

      - name: Frontend typecheck + vitest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci
          npm run smoke:frontend
          npm test

      - name: Playwright responsive header screenshots
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npx playwright install chromium
          npm run test:e2e

      - name: E2E — install PHP + MariaDB + Nginx, sites, curl, DB round-trip
        working-directory: src-tauri
        shell: pwsh
        env:
          DEVSTACK_DATA_DIR: ${{ runner.temp }}\devstack-e2e
          DEVSTACK_RESET_SITES: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --bin devstack_smoke --release
          $bin = Join-Path (Get-Location) 'target\release\devstack_smoke.exe'
          & $bin --e2e
          if ($LASTEXITCODE -ne 0) { throw "devstack_smoke --e2e failed ($LASTEXITCODE)" }

      - name: Launch built exe — window responds + UI within 3s
        shell: pwsh
        env:
          DEVSTACK_DATA_DIR: ${{ runner.temp }}\devstack-launch-ui
        run: |
          $ErrorActionPreference = 'Stop'
          # Real Tauri app (not smoke bin): catches AppHangB1 / "Tauri App" title / blocked setup.
          npm run build
          npx tauri build --no-bundle -- --release
          $exe = Join-Path (Get-Location) 'src-tauri\target\release\devstack.exe'
          if (-not (Test-Path $exe)) {
            $exe = Get-ChildItem -Path 'src-tauri\target\release' -Filter 'devstack.exe' -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $exe -or -not (Test-Path $exe)) { throw "devstack.exe not found after tauri build" }
          Write-Host "Launching $exe"
          New-Item -ItemType Directory -Force -Path $env:DEVSTACK_DATA_DIR | Out-Null
          $proc = Start-Process -FilePath $exe -PassThru -WindowStyle Normal
          $deadline = (Get-Date).AddSeconds(3)
          $okTitle = $false
          $okResponding = $false
          try {
            while ((Get-Date) -lt $deadline) {
              Start-Sleep -Milliseconds 100
              $p = Get-Process -Id $proc.Id -ErrorAction SilentlyContinue
              if (-not $p) { throw "devstack.exe exited during startup (code $($proc.ExitCode))" }
              if ($p.Responding) { $okResponding = $true }
              if ($p.MainWindowTitle -match 'DevStack') { $okTitle = $true }
              if ($okResponding -and $okTitle) { break }
            }
            $p = Get-Process -Id $proc.Id -ErrorAction SilentlyContinue
            if (-not $p) { throw "devstack.exe exited before checks completed" }
            if (-not $p.Responding) {
              throw "AppHang: process not Responding within 3s (title='$($p.MainWindowTitle)')"
            }
            if ($p.MainWindowTitle -notmatch 'DevStack') {
              throw "Window title was '$($p.MainWindowTitle)' (expected DevStack) within 3s"
            }
            # Setup phase log must show completion (watchdog / non-blocking setup).
            $logFile = Join-Path $env:DEVSTACK_DATA_DIR 'logs\devstack.log'
            $deadlineLog = (Get-Date).AddSeconds(2)
            $sawSetup = $false
            while ((Get-Date) -lt $deadlineLog) {
              if ((Test-Path $logFile) -and (Select-String -Path $logFile -Pattern 'setup_complete|Tauri setup complete' -Quiet -ErrorAction SilentlyContinue)) {
                $sawSetup = $true
                break
              }
              Start-Sleep -Milliseconds 100
            }
            if (-not $sawSetup) {
              Write-Host "WARN: setup_complete not yet in logs (window still responded)"
            }
            Write-Host "Launch OK: title=DevStack responding=True within 3s"
          } finally {
            if ($proc -and -not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              Start-Sleep -Milliseconds 500
              Get-Process -Name 'devstack' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Synthetic HTTPS probe (hosts + openssl s_server + curl)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $site = 'devstack-ci.test'
          $port = 18443
          $tmp = Join-Path $env:TEMP "devstack-https-smoke"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          $cert = Join-Path $tmp 'cert.pem'
          $key = Join-Path $tmp 'key.pem'
          $outLog = Join-Path $tmp 's_server.out'
          $errLog = Join-Path $tmp 's_server.err'

          $openssl = Get-Command openssl -ErrorAction SilentlyContinue
          if (-not $openssl) {
            Write-Host 'openssl not on PATH — skipping live HTTPS probe'
            exit 0
          }

          & openssl req -x509 -newkey rsa:2048 -sha256 -days 1 -nodes `
            -keyout $key -out $cert -subj "/CN=$site"
          if (-not (Test-Path $cert)) { throw 'openssl failed to write cert' }

          $hostsFile = "$env:SystemRoot\System32\drivers\etc\hosts"
          $entry = "127.0.0.1 $site"
          try {
            Add-Content -LiteralPath $hostsFile -Value "`n$entry" -ErrorAction Stop
            ipconfig /flushdns | Out-Null
            Write-Host "Wrote hosts entry for $site"
          } catch {
            Write-Host "Hosts write skipped (no admin): $($_.Exception.Message)"
            $site = '127.0.0.1'
          }

          $proc = Start-Process -FilePath $openssl.Source `
            -ArgumentList @('s_server','-accept',"$port",'-cert',$cert,'-key',$key,'-www') `
            -PassThru -WindowStyle Hidden `
            -RedirectStandardOutput $outLog -RedirectStandardError $errLog
          Start-Sleep -Seconds 2
          if ($proc.HasExited) {
            Get-Content $outLog,$errLog -ErrorAction SilentlyContinue | Write-Host
            throw "openssl s_server exited early (code $($proc.ExitCode))"
          }
          try {
            $url = "https://${site}:${port}/"
            $curl = Get-Command curl.exe -ErrorAction Stop
            $code = & $curl.Source -k -sS --max-time 15 -o (Join-Path $tmp 'body.txt') -w '%{http_code}' $url
            if ($LASTEXITCODE -ne 0 -or $code -ne '200') {
              Get-Content $outLog,$errLog -ErrorAction SilentlyContinue | Write-Host
              throw "Expected HTTP 200 from $url, got '$code' (curl exit $LASTEXITCODE)"
            }
            Write-Host "HTTPS probe OK: $url -> $code"
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }
