# macOS unit tests + end-to-end stack smoke (PHP + MariaDB + Nginx + sites).
name: macOS smoke

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  macos-smoke:
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo test
        working-directory: src-tauri
        timeout-minutes: 15
        run: cargo test --lib -- --nocapture

      - name: Frontend typecheck + vitest
        timeout-minutes: 10
        run: |
          set -euo pipefail
          npm ci
          npm run smoke:frontend
          npm test

      - name: Playwright responsive header screenshots
        timeout-minutes: 10
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Brew PHP + MariaDB + httpd (managed packages are Windows-first)
        timeout-minutes: 20
        run: |
          set -euo pipefail
          brew update
          brew install php mariadb httpd || brew upgrade php mariadb httpd || true
          php -v
          php -m | grep -i mysqli
          brew --prefix mariadb
          brew --prefix httpd
          brew services stop httpd || true

      - name: E2E — install PHP + MariaDB + Nginx, sites, curl, DB round-trip
        working-directory: src-tauri
        timeout-minutes: 40
        env:
          DEVSTACK_DATA_DIR: ${{ runner.temp }}/devstack-e2e
          DEVSTACK_RESET_SITES: "1"
        run: |
          set -euo pipefail
          cargo build --bin devstack_smoke --release
          ./target/release/devstack_smoke --e2e
