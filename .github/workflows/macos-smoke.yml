# macOS unit tests + end-to-end stack smoke (PHP + MariaDB + Nginx + sites).
name: macOS smoke

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  macos-smoke:
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo test
        working-directory: src-tauri
        timeout-minutes: 15
        env:
          LZMA_API_STATIC: "1"
          LIBZ_SYS_STATIC: "1"
          OPENSSL_STATIC: "1"
        run: cargo test --lib -- --nocapture

      - name: Frontend typecheck + vitest
        timeout-minutes: 10
        run: |
          set -euo pipefail
          npm ci
          npm run smoke:frontend
          npm test

      - name: Playwright responsive header screenshots
        timeout-minutes: 10
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Build release smoke + otool dylib gate
        working-directory: src-tauri
        timeout-minutes: 25
        env:
          LZMA_API_STATIC: "1"
          LIBZ_SYS_STATIC: "1"
          OPENSSL_STATIC: "1"
        run: |
          set -euo pipefail
          # Ensure Homebrew xz is visible during the build so a non-static link
          # would incorrectly pick it up — then otool must still show no /opt/homebrew.
          brew list xz >/dev/null 2>&1 || brew install xz || true
          cargo build --bin devstack_smoke --release
          ../scripts/check-macos-dylibs.sh ./target/release/devstack_smoke
          # Also build the real app binary (no bundle) and gate it.
          (cd .. && npm run build && npx tauri build --no-bundle)
          BIN="./target/release/devstack"
          test -x "$BIN"
          ../scripts/check-macos-dylibs.sh "$BIN"
          # Hide Homebrew xz and require the binary still starts (dyld fail = exit).
          XZ_OPT=""
          if [[ -d /opt/homebrew/opt/xz ]]; then XZ_OPT=/opt/homebrew/opt/xz; fi
          if [[ -d /usr/local/opt/xz ]]; then XZ_OPT=/usr/local/opt/xz; fi
          if [[ -n "$XZ_OPT" ]]; then mv "$XZ_OPT" "${XZ_OPT}.bak-devstack"; fi
          set +e
          DEVSTACK_DATA_DIR="${{ runner.temp }}/devstack-otool-launch" "$BIN" &
          PID=$!
          sleep 3
          kill -0 "$PID" 2>/dev/null
          LIVE=$?
          kill "$PID" 2>/dev/null
          wait "$PID" 2>/dev/null
          set -e
          if [[ -n "$XZ_OPT" && -e "${XZ_OPT}.bak-devstack" ]]; then mv "${XZ_OPT}.bak-devstack" "$XZ_OPT"; fi
          if [[ "$LIVE" -ne 0 ]]; then
            echo "FAIL: app died within 3s with Homebrew xz hidden (dyld?)" >&2
            exit 1
          fi
          echo "OK: release binary alive 3s with Homebrew xz hidden"

      - name: Brew PHP + MariaDB + httpd (managed packages are Windows-first)
        timeout-minutes: 20
        run: |
          set -euo pipefail
          brew update
          brew install php mariadb httpd || brew upgrade php mariadb httpd || true
          php -v
          php -m | grep -i mysqli
          brew --prefix mariadb
          brew --prefix httpd
          brew services stop httpd || true

      - name: E2E — install PHP + MariaDB + Nginx, sites, curl, DB round-trip
        working-directory: src-tauri
        timeout-minutes: 40
        env:
          DEVSTACK_DATA_DIR: ${{ runner.temp }}/devstack-e2e
          DEVSTACK_RESET_SITES: "1"
          LZMA_API_STATIC: "1"
          LIBZ_SYS_STATIC: "1"
          OPENSSL_STATIC: "1"
        run: |
          set -euo pipefail
          cargo build --bin devstack_smoke --release
          ./target/release/devstack_smoke --e2e
