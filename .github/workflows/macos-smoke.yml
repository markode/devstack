# macOS unit tests + end-to-end stack smoke (PHP + MariaDB + Nginx + Apache).
# Brew may exist on the runner for *building* packages, but the app install path
# must succeed with Homebrew binaries hidden from PATH.
name: macOS smoke

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  macos-smoke:
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo test
        working-directory: src-tauri
        timeout-minutes: 15
        env:
          LZMA_API_STATIC: "1"
          LIBZ_SYS_STATIC: "1"
          OPENSSL_STATIC: "1"
        run: cargo test --lib -- --nocapture

      - name: Frontend typecheck + vitest
        timeout-minutes: 10
        run: |
          set -euo pipefail
          npm ci
          npm run smoke:frontend
          npm test

      - name: Playwright responsive header screenshots
        timeout-minutes: 10
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Build release smoke + otool dylib gate
        working-directory: src-tauri
        timeout-minutes: 25
        env:
          LZMA_API_STATIC: "1"
          LIBZ_SYS_STATIC: "1"
          OPENSSL_STATIC: "1"
        run: |
          set -euo pipefail
          brew list xz >/dev/null 2>&1 || brew install xz || true
          cargo build --bin devstack_smoke --release
          ../scripts/check-macos-dylibs.sh ./target/release/devstack_smoke
          (cd .. && npm run build && npx tauri build --no-bundle)
          BIN="./target/release/devstack"
          test -x "$BIN"
          ../scripts/check-macos-dylibs.sh "$BIN"
          XZ_OPT=""
          if [[ -d /opt/homebrew/opt/xz ]]; then XZ_OPT=/opt/homebrew/opt/xz; fi
          if [[ -d /usr/local/opt/xz ]]; then XZ_OPT=/usr/local/opt/xz; fi
          if [[ -n "$XZ_OPT" ]]; then mv "$XZ_OPT" "${XZ_OPT}.bak-devstack"; fi
          set +e
          DEVSTACK_DATA_DIR="${{ runner.temp }}/devstack-otool-launch" "$BIN" &
          PID=$!
          sleep 3
          kill -0 "$PID" 2>/dev/null
          LIVE=$?
          kill "$PID" 2>/dev/null
          wait "$PID" 2>/dev/null
          set -e
          if [[ -n "$XZ_OPT" && -e "${XZ_OPT}.bak-devstack" ]]; then mv "${XZ_OPT}.bak-devstack" "$XZ_OPT"; fi
          if [[ "$LIVE" -ne 0 ]]; then
            echo "FAIL: app died within 3s with Homebrew xz hidden (dyld?)" >&2
            exit 1
          fi
          echo "OK: release binary alive 3s with Homebrew xz hidden"

      - name: Ensure prebuilt packages (release or local build)
        timeout-minutes: 100
        env:
          OUT: ${{ runner.temp }}/devstack-macos-pkgs
          DEVSTACK_PKG_HTTP_PORT: "18765"
        run: |
          set -euo pipefail
          brew install openssl@3 pcre2 pkgconf || true
          export PATH="$(brew --prefix pkgconf 2>/dev/null)/bin:$(brew --prefix)/bin:$PATH"
          chmod +x scripts/macos/ensure-packages-for-smoke.sh scripts/macos/build-packages.sh
          ./scripts/macos/ensure-packages-for-smoke.sh

      - name: Hide Homebrew binaries from PATH
        run: |
          set -euo pipefail
          # Keep system paths; drop Homebrew so the app cannot accidentally use brew php/httpd.
          NEW_PATH=""
          IFS=':' read -ra PARTS <<< "$PATH"
          for p in "${PARTS[@]}"; do
            case "$p" in
              /opt/homebrew/*|/usr/local/Cellar/*|/usr/local/opt/*|/home/linuxbrew/*) continue ;;
              /usr/local/bin|/opt/homebrew/bin|/opt/homebrew/sbin) continue ;;
            esac
            if [[ -z "$NEW_PATH" ]]; then NEW_PATH="$p"; else NEW_PATH="$NEW_PATH:$p"; fi
          done
          # Apply in this step AND for subsequent steps. GITHUB_ENV alone only
          # affects later steps, so a command -v brew check would still see brew.
          export PATH="/usr/bin:/bin:/usr/sbin:/sbin:${NEW_PATH}"
          echo "PATH=$PATH" >> "$GITHUB_ENV"
          echo "HOMEBREW_HIDDEN=1" >> "$GITHUB_ENV"
          hash -r || true
          if command -v brew >/dev/null 2>&1; then
            echo "FAIL: brew still on PATH after hide (at $(command -v brew))" >&2
            echo "PATH=$PATH" >&2
            exit 1
          fi
          if command -v php >/dev/null 2>&1; then
            echo "warning: system php still visible at $(command -v php)"
          fi
          echo "PATH after hide: $PATH"

      - name: E2E — install PHP + MariaDB + Nginx + Apache via app, curl .test:8080
        working-directory: src-tauri
        timeout-minutes: 50
        env:
          DEVSTACK_DATA_DIR: ${{ runner.temp }}/devstack-e2e
          DEVSTACK_RESET_SITES: "1"
          DEVSTACK_MACOS_MANAGED_ONLY: "1"
          LZMA_API_STATIC: "1"
          LIBZ_SYS_STATIC: "1"
          OPENSSL_STATIC: "1"
        run: |
          set -euo pipefail
          # Manifest URLs were exported by ensure-packages-for-smoke.sh
          test -n "${DEVSTACK_PHP_MANIFEST_URL:-}"
          test -n "${DEVSTACK_APACHE_MANIFEST_URL:-}"
          cargo build --bin devstack_smoke --release
          ./target/release/devstack_smoke --e2e --macos-managed
