[package]
name = "devstack"
version = "0.2.3"
description = "DevStack — local PHP/Node development environment"
authors = ["DevStack"]
edition = "2021"
default-run = "devstack"

[lib]
name = "devstack_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync"] }
futures-util = "0.3"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
rand = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
xz2 = "0.1"
async-trait = "0.1"
regex = "1"
semver = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
url = "2"
rcgen = "0.13"
rustls-pemfile = "2"
which = "7"
sysinfo = "0.33"
ar = "0.9"
notify = { version = "6", features = ["macos_fsevent"] }
tauri-plugin-dialog = "2.8.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
