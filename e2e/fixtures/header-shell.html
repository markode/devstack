<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DevStack shell fixture</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="app-shell platform-windows" data-platform="windows" data-testid="app-shell">
      <aside class="sidebar platform-windows" data-testid="sidebar">
        <div class="sidebar-top" data-tauri-drag-region data-testid="sidebar-drag">
          <div class="brand" data-tauri-drag-region>
            <div class="brand-mark">DS</div>
            <div class="brand-name">DevStack</div>
          </div>
        </div>
        <nav class="sidebar-nav" aria-label="Main">
          <button type="button" class="nav-item active">
            <span class="nav-icon" style="background:#007aff">W</span>
            <span class="nav-label">Sites</span>
          </button>
          <button type="button" class="nav-item">
            <span class="nav-icon" style="background:#777BB4">P</span>
            <span class="nav-label">PHP</span>
          </button>
        </nav>
      </aside>
      <main class="content">
        <header
          class="content-header platform-windows"
          data-testid="page-header"
          data-tauri-drag-region
        >
          <div class="content-header-drag" data-tauri-drag-region aria-hidden></div>
          <div class="content-title" data-testid="page-header-title" data-tauri-drag-region>
            Sites
          </div>
          <div class="content-header-meta">2 sites</div>
          <div
            class="content-header-loader"
            role="status"
            aria-label="Refreshing"
            data-testid="sites-header-loader"
          ></div>
          <div class="window-controls" data-testid="window-controls" role="group" aria-label="Window">
            <button type="button" class="win-btn win-min" aria-label="Minimize"></button>
            <button type="button" class="win-btn win-max" aria-label="Maximize"></button>
            <button type="button" class="win-btn win-close" aria-label="Close"></button>
          </div>
        </header>
        <div class="content-body">
          <div class="sites-toolbar" data-testid="sites-toolbar">
            <p class="sites-toolbar-blurb muted">
              Local projects on .test domains — click a tile for details.
            </p>
            <div class="sites-toolbar-actions">
              <span class="stack-status-pill" data-testid="stack-status-pill">
                <span class="status-dot"></span>
                Stopped
              </span>
              <button type="button" class="btn btn-install">Add site</button>
              <button type="button" class="btn btn-install">Duplicate</button>
              <button type="button" class="btn btn-primary">New WordPress</button>
              <button type="button" class="btn btn-install">Start stack</button>
            </div>
          </div>
          <div class="sites-grid" data-testid="sites-grid">
            <button type="button" class="site-tile">
              <div class="site-tile-top">
                <span class="fw-icon fw-wordpress">WP</span>
                <span class="status-dot"></span>
              </div>
              <div class="site-tile-name">demo</div>
              <div class="site-tile-domain">demo.test</div>
            </button>
            <button type="button" class="site-tile">
              <div class="site-tile-top">
                <span class="fw-icon fw-php">P</span>
                <span class="status-dot on"></span>
              </div>
              <div class="site-tile-name">nginxdash</div>
              <div class="site-tile-domain">nginxdash.test</div>
            </button>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
